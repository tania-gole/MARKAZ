name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build · Integration
    runs-on: ubuntu-latest
    # Postgres service for DB-backed integration tests (Block H onward).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markaz
          POSTGRES_PASSWORD: markaz_dev
          POSTGRES_DB: markaz_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U markaz -d markaz_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://markaz:markaz_dev@localhost:5433/markaz_dev?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm --filter @markaz/db exec prisma migrate deploy

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      - name: Integration tests
        run: pnpm turbo run test:integration
